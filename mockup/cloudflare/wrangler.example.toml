# DRAFT, unused. A sketch for a later Cloudflare Workers + D1 cutover
# (docs/CLOUDFLARE.md). Nothing reads this file, nothing is provisioned.
# Check every key against the current wrangler docs before using it.

name = "poio-mockup"
# The Workers entry doesn't exist yet: see docs/CLOUDFLARE.md → "A cutover".
main = "server/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# The built client (npm run build → dist/). The Worker runs first for the
# routes that need the server; everything else is a static file.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/invite/*"]

[[d1_databases]]
binding = "DB"
database_name = "poio"
database_id = "<from `wrangler d1 create poio`>"
migrations_dir = "cloudflare/migrations"

[vars]
POIO_MODEL = "claude-haiku-5-5"
POIO_MODEL_RECIPE = "claude-haiku-5-5"
POIO_SESSION_TOKEN_CAP = "60000"
POIO_DAILY_BUDGET_USD = "3"
POIO_MONTHLY_BUDGET_USD = "100"
POIO_PROFILE_DAILY_USD = "0.5"
POIO_PROFILE_MONTHLY_USD = "5"
POIO_INVITE_HOURS = "72"
POIO_PROFILE_SESSION_DAYS = "30"
POIO_TZ = "America/Mexico_City"
POIO_PUBLIC_URL = "https://<the workers.dev or custom origin>"

# Secrets, never in this file: `wrangler secret put ANTHROPIC_API_KEY`,
# and `wrangler secret put POIO_ACCESS_CODE` if the code path stays.
